name: auth
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account-ID aus config/accounts.json (z. B. yt1, ig1, tt1)"
        required: true
      schritt:
        description: "link = Anmelde-Link erzeugen, code = Code nach der Anmeldung eintragen"
        required: true
        default: link
        type: choice
        options: [link, code]
      code:
        description: "Nur bei schritt=code: ganze Adresse der Seite nach „Erlauben“ (oder nur der Code)"
        required: false

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Code verbergen
        env: {C: "${{ github.event.inputs.code }}"}
        run: |
          [ -n "$C" ] && echo "::add-mask::$C" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -q pynacl
      - name: Anmelden
        env:
          YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
          YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
          YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}
          IG1_APP_ID: ${{ secrets.IG1_APP_ID }}
          IG1_APP_SECRET: ${{ secrets.IG1_APP_SECRET }}
          IG1_ACCESS_TOKEN: ${{ secrets.IG1_ACCESS_TOKEN }}
          IG1_USER_ID: ${{ secrets.IG1_USER_ID }}
          TT1_CLIENT_KEY: ${{ secrets.TT1_CLIENT_KEY }}
          TT1_CLIENT_SECRET: ${{ secrets.TT1_CLIENT_SECRET }}
          TT1_REFRESH_TOKEN: ${{ secrets.TT1_REFRESH_TOKEN }}
          TT1_OPEN_ID: ${{ secrets.TT1_OPEN_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Neuer Account: hier seine Secrets ergänzen (z. B. YT2_*)
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          AUTH_CODE: ${{ github.event.inputs.code }}
          ACC: ${{ github.event.inputs.account }}
          STEP: ${{ github.event.inputs.schritt }}
        run: python tools/auth.py "$STEP" "$ACC"
