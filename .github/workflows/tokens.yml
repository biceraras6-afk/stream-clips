name: tokens
on:
  schedule:
    - cron: "41 3 * * 1"      # montags: Instagram-Token (60 Tage gültig) erneuern
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -q pynacl
      - name: Erneuern
        env:
          YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
          YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
          YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}
          IG1_APP_ID: ${{ secrets.IG1_APP_ID }}
          IG1_APP_SECRET: ${{ secrets.IG1_APP_SECRET }}
          IG1_ACCESS_TOKEN: ${{ secrets.IG1_ACCESS_TOKEN }}
          IG1_USER_ID: ${{ secrets.IG1_USER_ID }}
          TT1_CLIENT_KEY: ${{ secrets.TT1_CLIENT_KEY }}
          TT1_CLIENT_SECRET: ${{ secrets.TT1_CLIENT_SECRET }}
          TT1_REFRESH_TOKEN: ${{ secrets.TT1_REFRESH_TOKEN }}
          TT1_OPEN_ID: ${{ secrets.TT1_OPEN_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Neuer Account: hier seine Secrets ergänzen (z. B. YT2_*)
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from tools import ghapi, platforms
          from tools.campaigns import ACCOUNTS
          for a in ACCOUNTS:
              if a["active"] and a["platform"] == "instagram" and platforms.secret(a["secret_prefix"] + "_ACCESS_TOKEN"):
                  tok = platforms.instagram_refresh(a["secret_prefix"])
                  print(f"::add-mask::{tok}")
                  ghapi.set_secret(a["secret_prefix"] + "_ACCESS_TOKEN", tok)
                  print(f"{a['id']}: erneuert")
          PY
