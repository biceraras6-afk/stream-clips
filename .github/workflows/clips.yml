name: clips
on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Kampagnen-ID (Dateiname ohne .json) oder 'auto' = beste beigetretene Kampagne"
        required: true
        default: auto
      url:
        description: "Optional: bestimmtes Video (muss zu den freigegebenen Quellen gehören)"
        required: false
      max_clips:
        description: "Höchstzahl Clips"
        required: false
        default: "8"
      drive_url:
        description: "Optional: Google-Drive-Datei (Kampagnenmaterial, vom Nutzer freigegeben) statt Stream-Quelle"
        required: false
  workflow_call:
    inputs:
      campaign: {type: string, required: true}
      url: {type: string, required: false, default: ""}
      max_clips: {type: string, required: false, default: "8"}

permissions:
  contents: read

concurrency: clips-${{ inputs.campaign }}

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-models-v1}
      - uses: actions/cache@v4
        with: {path: state, key: "factory-state-${{ github.run_id }}", restore-keys: "factory-state-"}
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-montserrat >/dev/null
          pip install -q -r requirements.txt
      - name: Kampagne wählen
        id: pick
        env: {INPUT: "${{ inputs.campaign }}"}
        run: |
          if [ "$INPUT" = "auto" ]; then
            python tools/campaigns.py triage >/dev/null
            CID=$(python -c "import json;q=json.load(open('out/queue.json'));print(q[0] if q else '')")
            [ -z "$CID" ] && { echo "Keine beigetretene Kampagne – erst im Issue „Beitreten“ abhaken."; exit 1; }
          else
            CID="$INPUT"
          fi
          echo "cid=$CID" >> "$GITHUB_OUTPUT"
      - name: Clip-Fabrik
        env:
          CID: ${{ steps.pick.outputs.cid }}
          URL: ${{ inputs.url }}
          MAX: ${{ inputs.max_clips }}
          DRIVE: ${{ github.event.inputs.drive_url }}
        run: |
          ARGS=(--campaign "$CID" --max-clips "${MAX:-8}")
          [ -n "$URL" ] && ARGS+=(--url "$URL")
          if [ -n "$DRIVE" ]; then
            pip install -q gdown
            mkdir -p footage && gdown --fuzzy "$DRIVE" -O footage/in.mp4 2>&1 | tail -3
            ls -la footage | tail -2
            ARGS+=(--local-video footage/in.mp4)
          fi
          python tools/factory.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips-${{ steps.pick.outputs.cid }}-${{ github.run_number }}
          path: |
            out/clips/
            work/**/selection.json
          retention-days: 14
