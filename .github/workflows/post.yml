name: post
on:
  schedule:
    - cron: "7,37 * * * *"     # halbstündlich prüfen, ob ein Posting-Slot fällig ist
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Plan anzeigen (1) oder wirklich posten (0)"
        default: "1"
      one_shot_account:
        description: "Einmaliger Post auf Nutzerwunsch: Account-ID (z. B. yt1). Umgeht Schalter+Slot, 1 Post/Tag"
        default: ""

permissions:
  contents: read
  actions: read

concurrency: post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -q pynacl
      - name: Posten
        env:
          YT1_CLIENT_ID: ${{ secrets.YT1_CLIENT_ID }}
          YT1_CLIENT_SECRET: ${{ secrets.YT1_CLIENT_SECRET }}
          YT1_REFRESH_TOKEN: ${{ secrets.YT1_REFRESH_TOKEN }}
          IG1_APP_ID: ${{ secrets.IG1_APP_ID }}
          IG1_APP_SECRET: ${{ secrets.IG1_APP_SECRET }}
          IG1_ACCESS_TOKEN: ${{ secrets.IG1_ACCESS_TOKEN }}
          IG1_USER_ID: ${{ secrets.IG1_USER_ID }}
          TT1_CLIENT_KEY: ${{ secrets.TT1_CLIENT_KEY }}
          TT1_CLIENT_SECRET: ${{ secrets.TT1_CLIENT_SECRET }}
          TT1_REFRESH_TOKEN: ${{ secrets.TT1_REFRESH_TOKEN }}
          TT1_OPEN_ID: ${{ secrets.TT1_OPEN_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Neuer Account: hier seine Secrets ergänzen (z. B. YT2_*)
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ONE_SHOT_ACCOUNT: ${{ github.event.inputs.one_shot_account || '' }}
        run: |
          if [ -z "$GH_ADMIN_TOKEN" ]; then echo "GH_ADMIN_TOKEN fehlt – siehe docs/SETUP.md"; exit 0; fi
          python tools/post.py
