name: campaigns
on:
  schedule:
    - cron: "23 */3 * * *"   # alle 3 h: neue Kampagnen + Budgets
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: campaigns

env:
  GH_TOKEN: ${{ github.token }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  discover:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: state, key: "llm-${{ github.run_id }}", restore-keys: "llm-"}
      - name: Kampagnen finden/aktualisieren
        run: python tools/discover.py
      - name: Abgehakte Beitritte übernehmen
        run: python tools/joinlist.py sync
      - name: Prüfen, filtern, priorisieren, auto-stoppen
        run: python tools/campaigns.py triage --write
      - name: Beitritts-Issue aktualisieren
        run: python tools/joinlist.py publish
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/
          git diff --cached --quiet || git commit -m "campaigns: update $(date -u +%F_%H%M)"
          git push
      - uses: actions/upload-artifact@v4
        with: {name: campaigns-report, path: out/, retention-days: 7}

  joined:
    # Häkchen im Beitritts-Issue (nur vom Repo-Besitzer)
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'join-list') && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync
        env: {ISSUE_BODY: "${{ github.event.issue.body }}"}
        run: python tools/joinlist.py sync
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/
          git diff --cached --quiet || git commit -m "campaigns: joined"
          git push

  intake:
    # Fallback: Kampagne per Hand (Issue-Formular), nur eigene Issues
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'campaign') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: state, key: "llm-${{ github.run_id }}", restore-keys: "llm-"}
      - name: Erfassen
        env: {ISSUE_BODY: "${{ github.event.issue.body }}"}
        run: python tools/intake.py --issue | tee out.txt
      - name: Commit + Antwort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/
          git diff --cached --quiet || git commit -m "campaign intake #${{ github.event.issue.number }}"
          git push
          { echo '```'; cat out.txt; echo '```'; } > reply.md
          gh issue comment ${{ github.event.issue.number }} --body-file reply.md
