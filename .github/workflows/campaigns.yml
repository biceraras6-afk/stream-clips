name: campaigns
on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: "17 5,17 * * *"   # 2x täglich
  workflow_dispatch:
  push:
    paths: ["campaigns/**", "config/**"]

permissions:
  contents: write
  issues: write

concurrency: campaigns

jobs:
  intake:
    # nur eigene Issues mit Label "campaign" (Repo ist öffentlich)
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'campaign') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: state, key: "llm-${{ github.run_id }}", restore-keys: "llm-"}
      - name: Erfassen
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/intake.py --issue | tee out.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/
          git diff --cached --quiet || git commit -m "campaign intake #${{ github.event.issue.number }}"
          git push
      - name: Antwort im Issue
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          { echo '```'; cat out.txt; echo '```'; echo 'Werte prüfen, dann in der Datei `"verified": true` setzen.'; } > reply.md
          gh issue comment ${{ github.event.issue.number }} --body-file reply.md

  triage:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/campaigns.py validate || true
      - run: python tools/campaigns.py triage --write
      - name: Status-Änderungen sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/
          git diff --cached --quiet || git commit -m "campaigns: auto-stop"
          git push
      - uses: actions/upload-artifact@v4
        with: {name: campaigns-report, path: out/, retention-days: 14}
