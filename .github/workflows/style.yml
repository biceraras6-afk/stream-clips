name: style
on:
  workflow_dispatch:
    inputs:
      max_videos: {description: "Max. Referenzen", default: "40"}
      all_platforms: {description: "Auch TikTok/Instagram versuchen (1/0)", default: "0"}

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
      - name: Analyse
        env: {MAX: "${{ inputs.max_videos }}", ALL: "${{ inputs.all_platforms }}"}
        run: |
          ARGS=(--max-videos "${MAX:-40}")
          [ "$ALL" = "1" ] && ARGS+=(--all)
          python tools/style.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: style, path: docs/STYLE.md, retention-days: 14}
